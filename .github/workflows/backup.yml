# Verschlüsseltes Backup (Konzept 11.7, docs/spec/04_architektur.md Abschnitt 9, Plan 16), täglich 03:00 UTC.
# Umgebung backup ohne Freigabe; Secrets setzt Tim (scripts/backup-einrichten.mjs). Ohne Datenbank-Secrets endet der
# Lauf mit einer Warnung; ohne Storage-Token sichert er nur die Datenbank und warnt.
# Rolle backup_leser (Migration 20261104150000_backup_rollen.sql): Modus zur Laufzeit (BYPASSRLS oder Rückfall E7
# mit Policies backup_lesen). Dump mit pg_dump 17, weil supabase db dump intern SET ROLE postgres setzt (Plan 16 A2,
# lokal belegt). Nur Schema public, Daten als INSERT für die Wiederherstellungsprobe über die Management-API.
# Secrets nur in den Schritten, die sie brauchen; keine Ausgabe von Inhalten, nur Tabellennamen und Zahlen.
# Aktionen per Commit angeheftet.
name: backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: backup
  cancel-in-progress: false

env:
  PG_BILD: postgres:17-alpine

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: backup
    steps:
      - id: bereit
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_BACKUP }}
          AGE_SCHLUESSEL: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          STORAGE_TOKEN: ${{ secrets.SUPABASE_STORAGE_TOKEN_BACKUP }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$AGE_SCHLUESSEL" ] || [ -z "$GH_TOKEN" ]; then
            echo "::warning::Umgebung backup ist noch nicht eingerichtet (Tim, scripts/backup-einrichten.mjs); kein Backup"
            echo ok=false >> "$GITHUB_OUTPUT"
          else
            echo ok=true >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$STORAGE_TOKEN" ]; then echo storage=true >> "$GITHUB_OUTPUT"; else echo storage=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bereit.outputs.ok == 'true'
      - name: Modus und Rechte prüfen
        id: modus
        if: steps.bereit.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_BACKUP }}
        run: |
          # DB_URL und Anweisung erst im Container einsetzen: das Passwort steht nie in den Argumenten von docker run
          sql() { docker run --rm --network host -e DB_URL -e Q="$1" "$PG_BILD" sh -c 'psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "$Q"'; }
          bypass=$(sql "select rolbypassrls from pg_roles where rolname = current_user")
          if [ "$bypass" = "t" ]; then
            echo "Modus: BYPASSRLS"; echo rls=false >> "$GITHUB_OUTPUT"
          else
            echo "Modus: Zeilensicherheit (backup_lesen)"; echo rls=true >> "$GITHUB_OUTPUT"
          fi
          # Jede Basistabelle in public muss lesbar sein, im Rückfall mit Policy backup_lesen; sonst entstünde still
          # ein unvollständiges Backup. pg_class statt information_schema, das Tabellen ohne Recht verbirgt.
          fehlt=$(sql "select coalesce(string_agg(c.relname, ', ' order by c.relname), '')
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind in ('r', 'p')
              and (not has_table_privilege(c.oid, 'SELECT')
                or ('$bypass' <> 't' and not exists (select 1 from pg_policies p
                  where p.schemaname = 'public' and p.tablename = c.relname and p.policyname = 'backup_lesen')))")
          if [ -n "$fehlt" ]; then
            echo "::error::backup_leser darf nicht lesen: $fehlt"
            exit 1
          fi
          echo "Rechte: alle $(sql "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind in ('r', 'p')") Tabellen lesbar"
      - name: Datenbank (Schema, Daten, Zählung, Migrationen)
        if: steps.bereit.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_BACKUP }}
          MIT_RLS: ${{ steps.modus.outputs.rls }}
        run: |
          mkdir -p sicherung
          rls=""; [ "$MIT_RLS" = "true" ] && rls="--enable-row-security"
          pg() { docker run --rm --network host -e DB_URL -v "$PWD/sicherung:/aus" "$PG_BILD" "$@"; }
          sql() { docker run --rm --network host -e DB_URL -e Q="$1" "$PG_BILD" sh -c 'psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "$Q"'; }
          pg sh -c 'pg_dump "$DB_URL" -n public --schema-only -f /aus/schema.sql'
          pg sh -c "pg_dump \"\$DB_URL\" -n public --data-only --inserts --rows-per-insert=100 $rls -f /aus/daten.sql"
          # Zählung unmittelbar nach dem Dump, je Basistabelle in public (Wiederherstellungsprobe vergleicht damit)
          { echo "tabelle;zeilen"; sql "select c.relname || ';' ||
              (xpath('/row/n/text()', query_to_xml(format('select count(*) as n from public.%I', c.relname), false, true, '')))[1]::text
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind in ('r', 'p') order by c.relname"; } > sicherung/zaehlung.csv
          sql "select version from supabase_migrations.schema_migrations order by version" > sicherung/migrationen.txt
          echo "Tabellen: $(($(wc -l < sicherung/zaehlung.csv) - 1)), Zeilen: $(awk -F';' 'NR > 1 { s += $2 } END { print s + 0 }' sicherung/zaehlung.csv), Migrationen: $(wc -l < sicherung/migrationen.txt)"
          fotos=$(sql "select count(distinct fotopfad) from public.ki_feldprotokoll where fotopfad is not null")
          [[ "$fotos" =~ ^[0-9]+$ ]] || { echo "::error::Zahl der Fotos nicht lesbar"; exit 1; }
          echo "FOTOS=$fotos" >> "$GITHUB_ENV"
      - name: Storage-Bucket saattueten (nur lesend)
        if: steps.bereit.outputs.ok == 'true'
        env:
          STORAGE_TOKEN: ${{ secrets.SUPABASE_STORAGE_TOKEN_BACKUP }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_APIKEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          MIT_STORAGE: ${{ steps.bereit.outputs.storage }}
        run: |
          if [ "$MIT_STORAGE" = "true" ]; then
            node scripts/backup-storage.mjs --ziel sicherung/storage --mindestens "$FOTOS"
          else
            echo "::warning::Storage nicht gesichert: SUPABASE_STORAGE_TOKEN_BACKUP fehlt (scripts/backup-einrichten.mjs)"
            echo "Storage nicht gesichert (kein Token)" > sicherung/storage-nicht-gesichert.txt
          fi
      - name: Verschlüsseln und ablegen (30 Stände)
        if: steps.bereit.outputs.ok == 'true'
        env:
          AGE_SCHLUESSEL: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          stand="backup-$(date -u +%Y-%m-%d)"
          tar -czf "$stand.tar.gz" sicherung
          age -r "$AGE_SCHLUESSEL" -o "$stand.tar.gz.age" "$stand.tar.gz"
          rm -rf sicherung "$stand.tar.gz"
          groesse=$(stat -c %s "$stand.tar.gz.age")
          [[ "$groesse" =~ ^[0-9]+$ ]] || { echo "::error::Grösse nicht lesbar"; exit 1; }
          echo "GROESSE=$groesse" >> "$GITHUB_ENV"
          gh release create "$stand" "$stand.tar.gz.age" --repo hydrovisor/hydrovisor-backup --title "$stand" --notes "Automatisches Backup"
          gh release list --repo hydrovisor/hydrovisor-backup --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[30:] | .[].tagName' |
            while read -r alt; do gh release delete "$alt" --repo hydrovisor/hydrovisor-backup --cleanup-tag -y; done
      - name: backup_status melden (einziger Schreibweg der Rolle backup_leser)
        if: steps.bereit.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_BACKUP }}
        run: |
          [[ "$GROESSE" =~ ^[0-9]+$ ]] || { echo "::error::Grösse fehlt"; exit 1; }
          docker run --rm --network host -e DB_URL -e Q="select public.backup_status_melden($GROESSE)" "$PG_BILD" \
            sh -c 'psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$Q"'
