# Prüftor (Konzept 12.6, docs/spec/06_tests.md Abschnitt 1). Pflichtcheck im Ruleset: Job «pruefstor».
# Jobs, die App-Code, Datenbank oder Edge Functions brauchen, laufen erst, wenn die Dateien existieren
# (Paket I0-01 Grundgerüst, I0-03 Datenmodell); bis dahin werden sie übersprungen (docs/entscheide/0004).
# Aktionen per Commit angeheftet (Version im Kommentar).
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail: ein Fehler vor | tee lässt den Schritt scheitern; grep ohne -q, damit kein SIGPIPE

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vorhanden:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      db: ${{ steps.f.outputs.db }}
      edge: ${{ steps.f.outputs.edge }}
      issue: ${{ steps.f.outputs.issue }}
      mutation: ${{ steps.f.outputs.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          ZWEIG: ${{ github.head_ref }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          KERN: ${{ contains(github.event.pull_request.labels.*.name, 'kern') }}
        run: |
          [ -f package.json ] && echo app=true >> "$GITHUB_OUTPUT" || echo app=false >> "$GITHUB_OUTPUT"
          [ -f supabase/config.toml ] && echo db=true >> "$GITHUB_OUTPUT" || echo db=false >> "$GITHUB_OUTPUT"
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then echo edge=true >> "$GITHUB_OUTPUT"; else echo edge=false >> "$GITHUB_OUTPUT"; fi
          if [[ "$ZWEIG" =~ ^paket/([0-9]+)- ]]; then echo "issue=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; else echo issue= >> "$GITHUB_OUTPUT"; fi
          # Mutationstest für Kern-Pakete und jede Änderung an rechner, zielbereich, aufgaben (Konzept 12.6)
          if [ "$KERN" = "true" ] || git diff --name-only "$BASIS"...HEAD | grep -E '^src/domain/(rechner|zielbereich|aufgaben)' > /dev/null; then
            echo mutation=true >> "$GITHUB_OUTPUT"; else echo mutation=false >> "$GITHUB_OUTPUT"; fi

  regeln:
    # test.only, test.skip und neue Schnappschüsse lassen das Prüftor scheitern (Konzept 12.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Tests des Sperr-Hooks (.claude/hooks/sperre.mjs)
        run: node --test .claude/hooks/sperre.test.mjs
      - name: test.only, test.skip und Verwandte
        run: |
          ziele=$(ls -d src tests supabase/tests supabase/functions 2>/dev/null || true)
          [ -z "$ziele" ] && exit 0
          if grep -rnE '\b(it|test|describe)(\.[a-zA-Z]+)*\.(only|skip|skipIf|runIf|todo|fixme)\b|\b(xit|xtest|xdescribe|fit|fdescribe)\(' $ziele; then
            echo "::error::test.only, test.skip, todo, fixme oder x-/f-Varianten gefunden"; exit 1
          fi
      - name: neue Schnappschüsse
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          neu=$(git diff --name-only --diff-filter=A "$BASIS"...HEAD | grep -E '(__snapshots__/|\.snap$|-snapshots/)' || true)
          if [ -n "$neu" ]; then echo "::error::neue Schnappschüsse: $neu"; exit 1; fi
          if git diff -U0 "$BASIS"...HEAD -- src tests | grep -E '^\+' | grep -E 'toMatch(Inline)?Snapshot|toHaveScreenshot' > /dev/null; then
            echo "::error::neue Schnappschuss-Prüfung im Diff"; exit 1
          fi

  lint:
    needs: vorhanden
    if: needs.vorhanden.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: vorhanden
    if: needs.vorhanden.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: vorhanden
    if: needs.vorhanden.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - name: W0-Validator über den Stand im Repository (I0-05, startet die .ts-Dateien echt)
        run: npm run w0:pruefen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: bericht-unit, path: reports/, if-no-files-found: ignore }

  mutation:
    # Module rechner, zielbereich, aufgaben, Mindestwert 80 %
    needs: vorhanden
    if: needs.vorhanden.outputs.app == 'true' && needs.vorhanden.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:mutation

  db:
    # supabase start, db reset, pgTAP, Typen-Abgleich (E6), Seed-Zähltest mit Demo-Daten
    needs: vorhanden
    if: needs.vorhanden.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 3.0.0 } # fest wie lokal (I0-03, Typen-Abgleich)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.vorhanden.outputs.app == 'true'
        with: { node-version: 22, cache: npm }
      - run: supabase start
      - run: supabase db reset
      - name: pgTAP (--debug gibt die TAP-Zeilen mit Testnamen für die AK-Abdeckung aus, I0-03)
        run: mkdir -p reports && supabase test db --debug | tee reports/pgtap.txt
      - name: Typen-Abgleich
        if: needs.vorhanden.outputs.app == 'true'
        run: |
          supabase gen types typescript --local > /tmp/datenbank.types.ts
          diff -u src/daten/datenbank.types.ts /tmp/datenbank.types.ts || { echo "::error::Typen weichen ab: neu erzeugen und im Zweig committen"; exit 1; }
      - name: Seed-Integrationstests [SQL] gegen die lokale Datenbank (I0-05, Bericht reports/vitest-seed.json)
        if: needs.vorhanden.outputs.app == 'true'
        run: npm ci && npm run test:seed
      - name: Seed-Zähltest mit Demo-Daten
        if: needs.vorhanden.outputs.app == 'true'
        run: npm run seed -- --ziel lokal && npm run demo -- --laden
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: bericht-db, path: reports/, if-no-files-found: ignore }

  edge:
    needs: vorhanden
    if: needs.vorhanden.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - run: mkdir -p reports && deno test --allow-read --allow-env --reporter=junit supabase/functions | tee reports/deno.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: bericht-edge, path: reports/, if-no-files-found: ignore }

  e2e:
    # gegen vite build + vite preview und die lokale Datenbank mit den Demo-Szenarien S1 bis S9 (Konzept 11.5)
    needs: vorhanden
    if: needs.vorhanden.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: needs.vorhanden.outputs.db == 'true'
        with: { version: 3.0.0 } # fest wie lokal (I0-03, Typen-Abgleich)
      - name: Lokale Datenbank mit Demo-Szenarien
        if: needs.vorhanden.outputs.db == 'true'
        run: |
          supabase start
          supabase db reset
          npm run seed -- --ziel lokal
          npm run demo -- --laden
          supabase status -o env > /tmp/status.env
          url=$(grep '^API_URL=' /tmp/status.env | cut -d= -f2- | tr -d '"')
          key=$(grep -E '^(PUBLISHABLE_KEY|ANON_KEY)=' /tmp/status.env | head -1 | cut -d= -f2- | tr -d '"')
          echo "VITE_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: bericht-e2e, path: reports/, if-no-files-found: ignore }

  build:
    needs: vorhanden
    if: needs.vorhanden.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  ak-abdeckung:
    # liest die AK aus dem Issue des Pakets und die Testnamen aus allen Berichten (06_tests.md Abschnitt 2);
    # [Gerät]-Nummern aus dem Abnahmekommentar: nach dem Kommentar entfernt der Lead abnahme-wartet (neuer Lauf)
    needs: [vorhanden, unit, db, edge, e2e]
    if: always() && needs.vorhanden.outputs.issue != '' && needs.vorhanden.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: reports, pattern: bericht-*, merge-multiple: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.vorhanden.outputs.issue }}
          NR: ${{ github.event.pull_request.number }}
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f scripts/ak-abdeckung.ts ]; then
            if git cat-file -e "$BASIS:scripts/ak-abdeckung.ts" 2>/dev/null; then echo "::error::scripts/ak-abdeckung.ts wurde entfernt"; exit 1; fi
            echo "::warning::scripts/ak-abdeckung.ts fehlt noch (folgt mit I0-02)"; exit 0
          fi
          node scripts/ak-abdeckung.ts --issue "$ISSUE" --pr "$NR" --berichte reports

  testdatei-waechter:
    # Geschützt sind alle Dateien, die der Testentwickler angelegt hat: tests/testentwickler.txt auf main
    # plus die Dateien der «Tests:»-Commits dieses Pull Requests. Spätere Änderungen daran brauchen die
    # Freigabe des Prüfers (Label tests-freigegeben, setzt der Lead nach der Begründung; Konzept 12.4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          FREIGEGEBEN: ${{ contains(github.event.pull_request.labels.*.name, 'tests-freigegeben') }}
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          declare -A geschuetzt; gemeldet=()
          if git cat-file -e "$BASIS:tests/testentwickler.txt" 2>/dev/null; then
            while read -r f; do [ -n "$f" ] && geschuetzt["$f"]=1; done < <(git show "$BASIS:tests/testentwickler.txt" | grep -v '^#')
            geschuetzt["tests/testentwickler.txt"]=1
          fi
          for c in $(git rev-list --reverse "$BASIS"..HEAD); do
            betreff=$(git log -1 --format=%s "$c")
            dateien=$(git diff-tree --no-commit-id --name-only -r "$c")
            if [[ "$betreff" == Tests:* ]]; then
              for f in $dateien; do geschuetzt["$f"]=1; done
            else
              for f in $dateien; do [ -n "${geschuetzt[$f]:-}" ] && gemeldet+=("$(git log -1 --format=%h "$c") $f"); done
            fi
          done
          if [ ${#gemeldet[@]} -gt 0 ]; then
            { echo "### Geänderte Testdateien des Testentwicklers"; printf -- '- %s\n' "${gemeldet[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$FREIGEGEBEN" != "true" ]; then echo "::error::Testdateien des Testentwicklers geändert; Freigabe mit Label tests-freigegeben"; exit 1; fi
          fi

  referenz-hash:
    # Orakel (Konzept 12.6): Hash gegen die Repository-Variablen, die Tim setzt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          HASH_RECHNER: ${{ vars.REFERENZ_HASH_RECHNER }}
          HASH_TUETEN: ${{ vars.REFERENZ_HASH_TUETEN }}
        run: |
          fehler=0
          pruefe() {
            local datei=$1 soll=$2 name=$3
            if [ ! -f "$datei" ]; then
              if [ -n "$soll" ]; then echo "::error::$datei fehlt, obwohl $name gesetzt ist"; fehler=1; fi
              return 0
            fi
            local ist; ist=$(sha256sum "$datei" | cut -d' ' -f1)
            if [ -z "$soll" ]; then echo "::error::$datei liegt vor, die Repository-Variable $name fehlt (Tim setzt sie)"; fehler=1
            elif [ "$ist" != "$soll" ]; then echo "::error::$datei weicht vom Hash in $name ab"; fehler=1; fi
          }
          pruefe tests/golden/duengerrechner_referenz.csv "$HASH_RECHNER" REFERENZ_HASH_RECHNER
          pruefe data/eval/tueten_referenz.csv "$HASH_TUETEN" REFERENZ_HASH_TUETEN
          exit $fehler

  db-lock:
    # höchstens ein offener Pull Request mit Änderungen in supabase/migrations (Konzept 12.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          HAT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'db-lock') }}
          NR: ${{ github.event.pull_request.number }}
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          geaendert=$(git diff --name-only "$BASIS"...HEAD -- supabase/migrations | wc -l)
          [ "$geaendert" -eq 0 ] && exit 0
          [ "$HAT_LABEL" = "true" ] || { echo "::error::Migration geändert: Label db-lock setzen"; exit 1; }
          andere=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label db-lock --json number --jq "map(select(.number != $NR)) | length")
          [ "$andere" -eq 0 ] || { echo "::error::Ein anderer offener Pull Request trägt db-lock"; exit 1; }

  pruefstor:
    # einziger Pflichtcheck: scheitert, wenn ein Job fehlschlägt oder abbricht; übersprungene Jobs zählen als bestanden
    needs: [vorhanden, regeln, lint, typecheck, unit, mutation, db, edge, e2e, build, ak-abdeckung, testdatei-waechter, referenz-hash, db-lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          ERGEBNISSE: ${{ toJSON(needs) }}
        run: |
          echo "$ERGEBNISSE" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$ERGEBNISSE" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::Prüftor nicht bestanden"; exit 1
          fi
