# Migrationen nach hydrovisor-dev (Entscheid 0006). Nur von Hand (gh workflow run), nur von main,
# Ziel fest hydrovisor-dev; die Produktion migriert weiterhin nur deploy.yml.
# Das Access-Token liegt nur in der Umgebung production; deren Freigabe gilt auch für diesen Lauf.
# Eingabe zweig: Stand, dessen supabase/migrations eingespielt wird (für Abnahme 1 vor dem Merge).
# Aktionen per Commit angeheftet (Version im Kommentar).
name: dev-migration

on:
  workflow_dispatch:
    inputs:
      zweig:
        description: Zweig oder Commit mit den Migrationen
        required: true
        default: main
      trockenlauf:
        description: Nur anzeigen, was eingespielt würde
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: dev-migration
  cancel-in-progress: false

jobs:
  migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEV_PROJEKT: jalvmzgvxvidgmoxuglp # hydrovisor-dev, fest wie in .mcp.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.zweig }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 3.0.0 } # fest wie pr.yml und deploy.yml (I0-03)
      - name: Migration nach hydrovisor-dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TROCKEN: ${{ inputs.trockenlauf }}
        run: |
          optionen=(--yes "--remote=$DEV_PROJEKT")
          if [ "$TROCKEN" = "true" ]; then optionen+=(--dry-run); fi
          supabase db push "${optionen[@]}"
