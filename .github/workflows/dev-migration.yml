# Migrationen nach hydrovisor-dev (Entscheid 0006). Nur von Hand (gh workflow run), nur von main,
# Ziel fest hydrovisor-dev; die Produktion migriert weiterhin nur deploy.yml.
# Access-Token nur für hydrovisor-dev in der eigenen Umgebung dev (nur main, Befund Sicherheit 3); getrennt von production.
# Eingabe zweig: Zweig, dessen supabase/migrations eingespielt wird (für Abnahme 1 vor dem Merge).
# Konfiguration und CLI-Einstellungen kommen immer aus main; aus dem Zweig nur die Migrationsdateien.
# Aktionen per Commit angeheftet (Version im Kommentar).
name: dev-migration

on:
  workflow_dispatch:
    inputs:
      zweig:
        description: Zweig mit den Migrationen (main oder paket/<issue>-<kurz>)
        required: true
        default: main
      trockenlauf:
        description: Nur anzeigen, was eingespielt würde
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: dev-migration
  cancel-in-progress: false

jobs:
  migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEV_PROJEKT: jalvmzgvxvidgmoxuglp # hydrovisor-dev, fest wie in .mcp.json
      ZWEIG: ${{ inputs.zweig }}
    steps:
      - name: Zweig prüfen (nur main oder Paketzweige dieses Repositorys, keine Refs oder Commits)
        run: |
          [[ "$ZWEIG" == "main" || "$ZWEIG" =~ ^paket/[0-9]+-[a-z0-9-]+$ ]] || { echo "::error::Zweig nicht erlaubt: $ZWEIG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Migrationen aus dem Zweig übernehmen
        run: |
          git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$ZWEIG" > /dev/null || { echo "::error::Zweig fehlt: $ZWEIG"; exit 1; }
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$ZWEIG"
          rm -rf supabase/migrations
          git checkout FETCH_HEAD -- supabase/migrations
          if compgen -G 'supabase/.env*' > /dev/null || [ -e supabase/.temp ]; then echo "::error::supabase/.env oder .temp vorhanden"; exit 1; fi
          ls supabase/migrations
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Migration nach hydrovisor-dev (Management-API; die CLI braucht für die direkte Verbindung IPv6)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TROCKEN: ${{ inputs.trockenlauf }}
        run: |
          if [ "$TROCKEN" = "true" ]; then node scripts/dev-migration.mjs --trocken; else node scripts/dev-migration.mjs; fi
