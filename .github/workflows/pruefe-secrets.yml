# Einmalige Prüfung der Secrets in der Umgebung production (Strang 0).
# Gibt nie Werte aus, nur OK oder eine Fehlerklasse. Wird nach dem Lauf wieder gelöscht.
name: pruefe-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      PROD_REF: bsvcwseyrerqunjmajcl
    steps:
      - name: SUPABASE_ACCESS_TOKEN gegen die Management-API
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          fehler=0
          if [ -z "$TOKEN" ]; then echo "FEHLER: Secret leer"; exit 1; fi
          case "$TOKEN" in sbp_*) echo "OK: Format sbp_…";; *) echo "FEHLER: beginnt nicht mit sbp_"; fehler=1;; esac
          for pfad in "" "/database/migrations" "/functions"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$PROD_REF$pfad")
            if [ "$code" = "200" ]; then echo "OK: /v1/projects/<prod>$pfad -> $code"; else echo "FEHLER: /v1/projects/<prod>$pfad -> $code"; fehler=1; fi
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/jalvmzgvxvidgmoxuglp")
          if [ "$code" = "200" ]; then echo "WARNUNG: Token erreicht auch das Dev-Projekt ($code)"; else echo "OK: Dev-Projekt nicht erreichbar ($code)"; fi
          exit $fehler

      - name: SUPABASE_DB_URL_POOLER gegen die Datenbank
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_POOLER }}
        run: |
          if [ -z "$DB_URL" ]; then echo "FEHLER: Secret leer"; exit 1; fi
          fehler=0
          case "$DB_URL" in postgresql://postgres.$PROD_REF:*) echo "OK: Anfang und Benutzer";; *) echo "FEHLER: beginnt nicht mit postgresql://postgres.<prod>:"; fehler=1;; esac
          case "$DB_URL" in *@aws-1-eu-central-1.pooler.supabase.com:5432/postgres) echo "OK: Host, Port 5432, Datenbank";; *) echo "FEHLER: Ende stimmt nicht (Host/Port/Datenbank)"; fehler=1;; esac
          case "$DB_URL" in *YOUR-PASSWORD*|*\[*|*\]*) echo "FEHLER: Platzhalter oder eckige Klammern noch enthalten"; fehler=1;; esac
          case "$DB_URL" in *" "*) echo "FEHLER: enthält Leerzeichen"; fehler=1;; esac
          if err=$(PGCONNECT_TIMEOUT=15 psql "$DB_URL" -tAc "select 1" 2>&1 >/dev/null); then
            echo "OK: Verbindung über den Session Pooler, select 1 erfolgreich"
          else
            case "$err" in
              *"password authentication failed"*) echo "FEHLER: Passwort falsch";;
              *"Tenant or user not found"*) echo "FEHLER: Benutzer oder Projekt-Referenz falsch";;
              *"could not translate host"*) echo "FEHLER: Host nicht gefunden";;
              *"timeout"*|*"timed out"*) echo "FEHLER: Zeitüberschreitung";;
              *"invalid"*|*"URI"*|*"percent"*) echo "FEHLER: URL ungültig (Sonderzeichen im Passwort kodieren?)";;
              *) echo "FEHLER: anderer Verbindungsfehler";;
            esac
            fehler=1
          fi
          exit $fehler
