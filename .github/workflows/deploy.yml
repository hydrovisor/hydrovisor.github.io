# Auslieferung (Konzept 11.1, 12.6; docs/spec/04_architektur.md Abschnitt 9). Nur main.
# Migration, Seed und Edge Functions, wenn sich seit dem Tag letzte-migration etwas unter supabase/,
# data/ oder scripts/seed* geändert hat, und nur nach Tims Freigabe in der Umgebung production
# (Deployment-Branches der Umgebung auf main beschränkt, Tims Handgriff). Pages erst, wenn die App existiert.
# Aktionen per Commit angeheftet (Version im Kommentar).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rueckfall_probe:
        description: Rückfall-Probe (Rauchtest scheitert absichtlich, der Rückfall stellt letzter-guter-stand bereit)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  vorhanden:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      db: ${{ steps.f.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: f
        run: |
          [ -f package.json ] && echo app=true >> "$GITHUB_OUTPUT" || echo app=false >> "$GITHUB_OUTPUT"
          if [ ! -f supabase/config.toml ]; then echo db=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # ausstehend ist alles seit der letzten erfolgreichen Migration, nicht nur der letzte Push
          if ! git rev-parse -q --verify refs/tags/letzte-migration > /dev/null; then echo db=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only refs/tags/letzte-migration "$GITHUB_SHA" | grep -E '^(supabase/|data/|scripts/seed|src/domain/w0/)' > /dev/null; then
            echo db=true >> "$GITHUB_OUTPUT"; else echo db=false >> "$GITHUB_OUTPUT"; fi
      - name: Rückfall-Probe nur, wenn letzter-guter-stand der laufende Stand ist (sonst ein echter Rückfall)
        if: inputs.rueckfall_probe
        run: |
          tag=$(git rev-parse -q --verify 'refs/tags/letzter-guter-stand^{commit}' || true)
          if [ "$tag" != "$GITHUB_SHA" ]; then
            echo "::error::Rückfall-Probe nur, wenn letzter-guter-stand = $GITHUB_SHA (Tag: ${tag:-fehlt})"; exit 1
          fi

  migration:
    needs: vorhanden
    if: needs.vorhanden.outputs.db == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 3.0.0 } # fest wie lokal (I0-03, Typen-Abgleich)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - name: Migration
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_POOLER }}
        # --yes: CLI 3.0.0 fragt ohne Terminal nach und bricht sonst ohne Änderung ab (Lauf 41645672298)
        run: supabase db push --yes --db-url "$DB_URL"
      - name: Seed (Wissen, Sortenstamm, Konstanten; keine Demo-Daten) – bis zum Scharfschalten nur Trockenlauf
        env:
          SEED_DB_URL: ${{ secrets.SUPABASE_DB_URL_POOLER }}
        # --trocken: prüfen, Skript ausführen und zurückrollen, Bericht in der Job-Zusammenfassung (Plan 10, Entscheid 0007);
        # scharf erst nach dem ersten grünen Trockenlauf und der W0-Teilfreigabe in einem eigenen Paket
        run: npm ci && npm run seed -- --ziel produktion --trocken
      - name: Edge Functions
        if: hashFiles('supabase/functions/**') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJEKT: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
        run: supabase functions deploy --project-ref "$PROJEKT" --yes
      - name: Tag letzte-migration nachziehen
        run: |
          git tag -f letzte-migration "$GITHUB_SHA"
          git push -f origin refs/tags/letzte-migration

  pages:
    needs: [vorhanden, migration]
    if: always() && needs.vorhanden.result == 'success' && needs.vorhanden.outputs.app == 'true' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build mit den Produktions-Variablen (öffentlich, keine Secrets)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_COMMIT: ${{ github.sha }}
        # ohne die Variablen baute die App still gegen die lokale Adresse (Plan 8, A1; Prüferbefund 2)
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Repository-Variablen VITE_SUPABASE_URL oder VITE_SUPABASE_PUBLISHABLE_KEY fehlen"; exit 1; }
          npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  rauchtest:
    # mobile Chrome-Emulation gegen die echte Adresse: version.json = Commit, Heute oder Anmeldung erscheint.
    # !cancelled(): ohne Statusfunktion gibt GitHub «skipped» der übersprungenen migration weiter (Befund I0-01).
    # Rückfall-Probe (workflow_dispatch, Entscheid 0005): erwartet absichtlich einen falschen Commit und scheitert nach 20 s.
    needs: pages
    if: ${{ !cancelled() && needs.pages.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - env:
          BASIS_URL: https://hydrovisor.github.io/
          ERWARTETER_COMMIT: ${{ inputs.rueckfall_probe && 'rueckfall-probe' || github.sha }}
          RAUCHTEST_WARTEN_S: ${{ inputs.rueckfall_probe && '20' || '300' }}
        run: npx playwright test -c playwright.rauchtest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: bericht-rauchtest, path: reports/, if-no-files-found: ignore }

  tag-nachziehen:
    needs: rauchtest
    if: ${{ !cancelled() && needs.rauchtest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git tag -f letzter-guter-stand "$GITHUB_SHA"
          git push -f origin refs/tags/letzter-guter-stand

  rueckfall:
    # Rauchtest gescheitert: Stand des Tags letzter-guter-stand neu bauen und bereitstellen
    needs: rauchtest
    if: ${{ !cancelled() && needs.rauchtest.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: letzter-guter-stand
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Repository-Variablen VITE_SUPABASE_URL oder VITE_SUPABASE_PUBLISHABLE_KEY fehlen"; exit 1; }
          VITE_COMMIT=$(git rev-parse HEAD) npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # eigener Artefaktname: pages hat im selben Lauf schon «github-pages» hochgeladen (Rückfall-Probe 1.11.2026)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: dist, name: github-pages-rueckfall }
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with: { artifact_name: github-pages-rueckfall }
      - env:
          PROBE: ${{ inputs.rueckfall_probe }}
        run: |
          if [ "$PROBE" = "true" ]; then
            echo "::notice::Rückfall-Probe: letzter guter Stand $(git rev-parse --short HEAD) wieder bereitgestellt"; exit 0
          fi
          echo "::error::Rauchtest gescheitert, letzter guter Stand wieder bereitgestellt; Fehler-Issue anlegen"; exit 1
